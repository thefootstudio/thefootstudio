span x="1000" dy="0">Tarsal tunnel</tspan><tspan x="1000" dy="26">where the nerve passes under</tspan><tspan x="1000" dy="26">a band of tissue on the</tspan><tspan x="1000" dy="26">inside of the ankle</tspan></text><polyline points="812.0,1302.0 990,1312.0" fill="none" stroke="#1a1a1a" stroke-width="1.2"/><circle cx="812.0" cy="1302.0" r="4" fill="#1a1a1a"/><text x="1000" y="1319" text-anchor="start" style="font-family:Montserrat,Arial,sans-serif;fill:#1a1a1a;letter-spacing:.03em;font-size:21px"><tspan x="1000" dy="0">Tibial nerve</tspan><tspan x="1000" dy="26">from the lower leg</tspan></text><text x="678.0" y="1412" text-anchor="middle" style="font-family:Montserrat,Arial,sans-serif;fill:#1a1a1a;letter-spacing:.03em;font-size:16px;fill-opacity:.6">The underside of the foot, toes at the top. Simplified illustration.</text></svg>